name: SAIF CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  kernel-core:
    name: Rust core checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

  qemu-image:
    name: Build and boot SAIF x86_64 UEFI image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Buildroot and QEMU host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bc build-essential cpio file g++ gcc git libncurses-dev patch perl python3 qemu-system-x86 rsync unzip wget xz-utils

      - name: Cache Buildroot downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/saif-buildroot/dl
          key: ${{ runner.os }}-saif-buildroot-2025.02.19-uefi
          restore-keys: |
            ${{ runner.os }}-saif-buildroot-2025.02.19
            ${{ runner.os }}-saif-buildroot-

      - name: Build SAIF x86_64 legacy and UEFI images
        run: |
          SAIF_OUTPUT_DIR="$GITHUB_WORKSPACE/build-output/saif-qemu" SAIF_DL_DIR="$HOME/.cache/saif-buildroot/dl" SAIF_JOBS=2 bash ./scripts/build-qemu-image.sh

      - name: Boot legacy QEMU image and verify network interface
        run: bash ./scripts/test-qemu-boot.sh "$GITHUB_WORKSPACE/build-output/saif-qemu"

      - name: Boot GPT disk through OVMF UEFI and verify SAIF
        run: bash ./scripts/test-qemu-uefi-boot.sh "$GITHUB_WORKSPACE/build-output/saif-qemu"

      - name: Upload bootable images and evidence
        uses: actions/upload-artifact@v4
        with:
          name: saif-x86_64-uefi-preview
          path: |
            build-output/saif-qemu/saif-qemu-bzImage
            build-output/saif-qemu/saif-qemu-rootfs.ext2
            build-output/saif-qemu/saif-uefi-disk.img
            build-output/saif-qemu/OVMF_CODE.fd
            build-output/saif-qemu/OVMF_VARS.fd
            build-output/saif-qemu/buildroot.config
            build-output/saif-qemu/buildroot-version.txt
            build-output/saif-qemu/SHA256SUMS
            build-output/saif-qemu/qemu-serial.log
            build-output/saif-qemu/qemu-uefi-serial.log
          if-no-files-found: error
          retention-days: 14
